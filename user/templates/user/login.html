{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 - 标注平台</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'user/css/login.css' %}">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">L</div>
                <h1 class="auth-title">欢迎回来</h1>
                <p class="auth-subtitle">请登录您的标注平台账号</p>
            </div>

            {% if messages %}
                {% for msg in messages %}
                <div class="alert alert-{{ msg.tags|default:'danger' }}">
                    {{ msg }}
                </div>
                {% endfor %}
            {% endif %}

            {% if form.errors %}
                <div class="alert alert-danger">
                    用户名或密码错误，请重试
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label class="form-label" for="id_username">用户名</label>
                    <input type="text" name="username" id="id_username" class="form-control" placeholder="请输入用户名" autocomplete="username" autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label" for="id_password">密码</label>
                    <input type="password" name="password" id="id_password" class="form-control" placeholder="请输入密码" autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg">登 录</button>
            </form>

            <div class="auth-footer">
                还没有账号？<a href="{% url 'register' %}">立即注册</a>
            </div>
        </div>
    </div>
</body>
</html>
