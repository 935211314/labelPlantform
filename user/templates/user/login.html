{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>登录</title>
    <link rel="stylesheet" href="{% static 'user/css/login.css' %}">
</head>
<body>
    <div class="container">
        <h2>用户登录</h2>

        {% if form.errors %}
            <p class="error-message">用户名或密码错误</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">登录</button>
        </form>

        <div class="register-link">
            <p>还没有账号？<a href="{% url 'register' %}">注册</a></p>
        </div>
    </div>
</body>
</html>
