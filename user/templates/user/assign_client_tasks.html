{% load static %}
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>给 {{ client.username }} 分配任务包</title>
  <link rel="stylesheet" href="{% static 'label/css/assign_client_tasks.css' %}">
  <script src="{% static 'labelweb/scripts/jquery-3.4.1.js' %}"></script>
</head>
<body>
  <div class="container">
    <h2 class="page-title">给 {{ client.username }} 分配任务包</h2>

    <!-- ✅ 筛选区域 -->
    <form method="get" class="filter-form">
      <label for="org">筛选组织：</label>
      <select name="org" id="org" onchange="this.form.submit()">
        <option value="">全部组织</option>
        {% for org in organizations %}
          <option value="{{ org.id }}" {% if org.id|stringformat:"s" == request.GET.org %}selected{% endif %}>
            {{ org.name }}
          </option>
        {% endfor %}
      </select>
    </form>

    <form method="post" class="task-form">
      {% csrf_token %}
      <div class="table-wrapper">
        <table class="pkg-table">
          <thead>
            <tr>
              <th>
                <input type="checkbox" id="selectAll">
                全选
              </th>
              <th>任务包名称</th>
              <th>组织</th>
              <th>创建时间</th>
            </tr>
          </thead>
          <tbody>
            {% for task in all_tasks %}
              <tr>
                <td>
                  <input type="checkbox" name="task_ids" value="{{ task.id }}"
                         {% if task.id in assigned_ids %}checked{% endif %}>
                </td>
                <td>{{ task.name }}</td>
                <td>{{ task.allowed_organization|default:"未分配" }}</td>
                <td>{{ task.created_at|date:"Y-m-d H:i" }}</td>
              </tr>
            {% empty %}
              <tr>
                <td colspan="4" class="no-data">暂无符合条件的任务包</td>
              </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">保存分配</button>
        <a href="{% url 'client_manage' %}" class="btn btn-secondary">返回</a>
      </div>
    </form>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const selectAll = document.getElementById("selectAll");
      const checkboxes = document.querySelectorAll('input[name="task_ids"]');

      selectAll.addEventListener("change", function() {
        checkboxes.forEach(cb => {
          cb.checked = selectAll.checked;
        });
      });
    });
  </script>
</body>
</html>
