{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>任务包管理 - 标注平台</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'label/css/manage_packages.css' %}">
</head>
<body>
    <div class="app-layout">
        <aside class="app-sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">L</div>
                <span class="sidebar-brand">标注平台</span>
            </div>
            <div class="sidebar-user">
                <div class="user-avatar">{{ request.user.username|make_list|first|upper }}</div>
                <div class="user-info">
                    <div class="user-name">{{ request.user.username }}</div>
                    <div class="user-role">平台管理员</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section-title">任务管理</div>
                <a href="/" class="nav-link">
                    <span class="nav-icon">&#x1F3E0;</span> 返回首页
                </a>
                <a href="{% url 'upload_task_package' %}" class="nav-link">
                    <span class="nav-icon">&#x1F4E6;</span> 上传任务包
                </a>
                <a href="{% url 'manage_packages' %}" class="nav-link active">
                    <span class="nav-icon">&#x1F4CB;</span> 管理任务包
                </a>
            </nav>
            <div class="sidebar-footer">
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="logout-btn">
                        <span>&#x21A9;</span> 退出登录
                    </button>
                </form>
            </div>
        </aside>

        <main class="app-main">
            <header class="app-topbar">
                <div>
                    <h1 class="topbar-title">任务包管理</h1>
                    <span class="topbar-breadcrumb">管理和监控所有任务包进度</span>
                </div>
                <a href="{% url 'upload_task_package' %}" class="btn btn-primary btn-sm">上传任务包</a>
            </header>

            <div class="app-content">
                <div class="card">
                    <div class="card-body" style="padding:0;">
                        <form id="filter-form" method="get">
                            {% include 'label/manage_packages_table.html' %}
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

<script>
function getCsrfToken() {
    return document.cookie.split('; ').find(r => r.startsWith('csrftoken='))?.split('=')[1] || '';
}

function deletePackage(pkgId, pkgName) {
    if (!confirm(`确认删除任务包【${pkgName}】吗？该操作不可恢复！`)) return;

    fetch(`/label/delete/${pkgId}/`, {
        method: "POST",
        headers: {
            "X-CSRFToken": getCsrfToken(),
            "X-Requested-With": "XMLHttpRequest"
        }
    }).then(res => res.json())
      .then(data => {
          if (data.success) {
              alert(data.message);
              location.reload();
          } else {
              alert("删除失败：" + (data.message || "未知错误"));
          }
      }).catch(err => {
          alert("请求失败：" + err);
      });
}

document.addEventListener('DOMContentLoaded', function() {
    const baseUrl = window.location.pathname;
    const filterIds = ['filter-org', 'filter-annotation', 'filter-qc', 'filter-client'];

    function handleFilterChange() {
        const params = new URLSearchParams();
        const vals = {};
        filterIds.forEach(id => {
            const el = document.getElementById(id);
            vals[id] = el ? el.value : '';
        });
        if (vals['filter-org']) params.append('org', vals['filter-org']);
        if (vals['filter-annotation']) params.append('annotation_status', vals['filter-annotation']);
        if (vals['filter-qc']) params.append('qc_status', vals['filter-qc']);
        if (vals['filter-client']) params.append('client_status', vals['filter-client']);

        const url = params.toString() ? `${baseUrl}?${params.toString()}` : baseUrl;
        document.body.style.cursor = 'wait';

        fetch(url, { method: 'GET', headers: { 'X-Requested-With': 'XMLHttpRequest' } })
            .then(r => r.json())
            .then(data => {
                if (data.html) {
                    document.querySelector('.table-wrapper form').innerHTML = data.html;
                }
                document.body.style.cursor = 'default';
            })
            .catch(err => {
                console.error('筛选请求失败:', err);
                document.body.style.cursor = 'default';
            });
    }

    filterIds.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('change', handleFilterChange);
    });
});
</script>
</body>
</html>
