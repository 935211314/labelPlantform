{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>标注界面 - 标注平台</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <style>
        .iframe-container {
            width: 100%;
            height: calc(100vh - 120px);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            background: var(--bg-surface);
        }
        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside class="app-sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">L</div>
                <span class="sidebar-brand">标注平台</span>
            </div>
            <div class="sidebar-user">
                <div class="user-avatar">{{ request.user.username|make_list|first|upper }}</div>
                <div class="user-info">
                    <div class="user-name">{{ request.user.username }}</div>
                    <div class="user-role">标注员</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section-title">标注工作</div>
                <a href="/" class="nav-link">
                    <span class="nav-icon">&#x1F3E0;</span> 返回首页
                </a>
                <a href="{% url 'available_packages' %}" class="nav-link">
                    <span class="nav-icon">&#x1F4E5;</span> 可领取任务包
                </a>
                <a href="{% url 'my_task_package' %}" class="nav-link">
                    <span class="nav-icon">&#x1F4DD;</span> 我的任务包
                </a>
            </nav>
            <div class="sidebar-footer">
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="logout-btn">
                        <span>&#x21A9;</span> 退出登录
                    </button>
                </form>
            </div>
        </aside>

        <main class="app-main">
            <header class="app-topbar">
                <div>
                    <h1 class="topbar-title">标注工作区</h1>
                    <span class="topbar-breadcrumb">当前任务包：{{ image.filename|default:"-" }}</span>
                </div>
                <a href="{% url 'my_task_package' %}" class="btn btn-ghost">返回任务列表</a>
            </header>

            <div class="app-content">
                <div class="card" style="padding:0;overflow:hidden;">
                    <div class="iframe-container">
                        <iframe src="{% static 'labelme/tool.html' %}?mode=i&folder=&image={{ image.image.url }}"></iframe>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
